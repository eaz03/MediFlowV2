{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediflow - Login</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="icon" href="/static/logo/logo_app.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{% static 'styles/login.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <title>Login</title>
</head>
<body>
    <main>
        <div class="login-container">
            <div class="login-text">
                <div class="login-name">
                    <p>MediFlow</p>
                </div>
                <form class="login-form" method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="email-label">
                        <label for="email">E-mail</label>
                    </div>
                    <div class="email-input">
                        <span><i aria-hidden="true"></i></span>
                        {{ form.email }}
                    </div>

                    <div class="password-label">
                        <label for="password">Password</label>
                    </div>
                    <div class="password-input">
                        <span><i aria-hidden="true"></i></span>
                        {{ form.password }}
                    </div>
                    <div class="btn">
                        <button type="submit" class="submit-btn">Log in</button>
                    </div>
                    <div style="margin-top: 12px; text-align: center;">
                        <a href="{% url 'register' %}">Create account</a>
                    </div>
                </form>
            </div>
            <div class="login-pic">
                <img src="/media/login_pic.jpg" alt="login image">
            </div>
        </div>

        <!-- Modal de error -->
       <div id="errorModal" class="modal fade" role="dialog">
            <div class="modal-dialog">
                <!-- Modal contenido -->
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal">&times;</button>
                        <h4 class="modal-title">Error trying to log in.</h4>
                    </div>
                    <div class="modal-body">
                        <p>{{ error_message }}</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <!-- Mostrar modal si hay un mensaje de error -->
    <script>
        $(document).ready(function() {
            {% if error_message %}
                $('#errorModal').modal('show');
            {% endif %}
        });
    </script>
</body>
</html>
